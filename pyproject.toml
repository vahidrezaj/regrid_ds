[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-preproc"
version = "0.1.0"
description = "Preprocessing pipelines that convert ocean state and atmospheric forcing NetCDF data (per data source: hbm_prep, nemo_prep, ...) into .pt/.h5 tensors ready for ODyNO model training"
requires-python = ">=3.10"
authors = [{ name = "vahidreza", email = "jahanmard.vr@gmail.com" }]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "xarray>=2024.0",
    "dask>=2026.7",
    "netCDF4>=1.6",
    "h5netcdf>=1.3",
    "h5py>=3.0",
    "hydra-core>=1.3.2",
    "pyproj>=3.6",
    "cartopy>=0.23",
    "xgcm>=0.8",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
regrid = [
    "xesmf>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
