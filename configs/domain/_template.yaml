# Template domain config -- copy to configs/domain/<domain_name>.yaml and fill in.

# Domain id, used in the output folder name and figure filenames.
name: baltic_sea

# Read -> regrid -> write pipeline class. Dataset-agnostic, so this is the same for
# every domain unless a future source needs genuinely different orchestration.
preproc_cls:
  _target_: regridder.PreProcessing
  _partial_: true

# Target grid: a square, domain_size km wide, grid_size points per side
# So, resolution = domain_size / (grid_size - 1))
domain_size: 1400
grid_size: 561

# Target grid center.
lat_0: 59.9
lon_0: 19.9

# Rotate the grid's local +y axis this many degrees clockwise from true north, instead
# of aligning it to true north. Useful for boxing a tilted source domain more tightly.
alpha_deg: 0.0
# alpha_deg: 25   # nordic_seas -- picked offline as the minimum-area enclosing square

# Output time range ([start included, end excluded)) and step, in hours.
from_to: ["2013-10-01T01:00", "2026-01-01T01:00"]
ts: 1

# Zarr writer: chunk size along time (hours) -- the smallest unit a reader decompresses;
# shard size along time (hours) -- chunks grouped into one file on disk, must be a multiple
# of time_chunk (null = no sharding, one file per chunk); Blosc compression level.
# 1-hour chunks suit random-access training reads; weekly shards keep the file count low.
time_chunk: 1
time_shard: 168
clevel: 3

# Per-dataset filename-match tokens: one file queue per token, matched anywhere in the
# filename. null falls back to a single unfiltered queue. Keys are dataset.name values,
# so a domain can host datasets from multiple sources side by side.
file_match:
  hbm_ocean: [IDW, BS, NS]   # priority order when queues are mosaiced (HBM regions)
  hbm_forcing: null
  hbm_bathymetry: [bsns_005]

# Optional per-dataset pre-filter on the (already sorted-by-date) file queue: [start, end]
# filenames, inclusive. Either bound may be null to leave that end open. Skips reads on
# files outside the range of interest; never applies to a static dataset.
file_range:
  hbm_ocean: null
  hbm_forcing: null
