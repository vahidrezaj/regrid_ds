name: nordic_seas

preproc_cls:
  _target_: regridder.PreProcessing
  _partial_: true

# domain_size in km
# lat_0/lon_0: centroid of domain_cfg's ocean-point glamt/gphit bounding box.
# alpha_deg: rotates the grid to match the domain's actual tilt -- found by taking the
#   convex hull of domain_cfg's ocean footprint (projected into this AEQD frame) and
#   scanning rotation angle for the minimum-area enclosing square centered at the
#   origin (0.02deg resolution near the minimum). At this angle, a 2686km square
#   covers 100% of the ocean footprint -- vs. 3435km needed unrotated (today's
#   domain_size was 3200km, so the old grid didn't even fully cover the domain).
# domain_size/grid_size: 2686km rounded up to 2700km, -> ~9.29km resolution,
#   matching the native e1t/e2t (~9.27km).
domain_size: 2000
grid_size: 290
alpha_deg: 26.22
lat_0: 70.8
lon_0: -1.8

from_to:  # // [start included, end excluded) -- 1993 is missing from the source entirely
  - 1980-01-01T00:30
  - 2025-01-01T00:00
ts: 1 # // time-step in `hour`

# Zarr writer:
time_chunk: 24  # // in `hour`
clevel: 3

# per-dataset filename-match tokens, one file queue per token. For nemo_ocean, order is positional, not priority (see NemoOceanReader.__call__)
file_match:
  nemo_ocean: [ssh, ubar, vbar]
  nemo_forcing: null

# optional pre-filter on the (already sorted-by-date) file queue: [start, end] (inclusive) // see regridder.py
file_range: null
