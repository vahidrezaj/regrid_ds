name: nemo_ocean

folder: "H:/NordicSeas/ocean"
variable_names: [ssh] # [ssh, ubar, vbar]

# Optional new names/attrs:
variable_attrs: null

# interpolation/extrapolation method(s): a single string or a list of strings with one entry per variable
interp_method: bilinear
extrap_method: nearest_s2d

use_mask: true  # NaN in ssh/ubar/vbar is a real land mask

# paired vector variables for rotation-aware regridding (from true north/east into the target grid's local basis):
# pair_vars_list:
#   - [ubar, vbar]

reader_fn:
  _target_: nemo_reader.NemoOceanReader
  domain_cfg_path: "H:/NordicSeas/ocean/nordic_seas_domain_cfg.nc"
  ssh_var: ssh
  u_var: ubar
  v_var: vbar
