name: nemo_ocean
source: nemo

folder: "${nemo_root}/ocean"
variable_names: [ssh] # [ssh, ubar, vbar]

# Optional new names/attrs:
variable_attrs: null

# interpolation method(s): a single string or a list of strings with one entry per variable
interp_method: bilinear

# shared land mask (build first: mode=land_mask dataset=nemo_ocean) + fill non-land gaps
land_mask: true
fill_method: laplace  # // nearest, laplace or null

# paired vector variables for rotation-aware regridding (from true north/east into the target grid's local basis):
# pair_vars_list:
#   - [ubar, vbar]

reader_fn:
  _target_: nemo_reader.NemoOceanReader
  domain_cfg_path: "${..folder}/nordic_seas_domain_cfg.nc"
  ssh_var: ssh
  u_var: ubar
  v_var: vbar
