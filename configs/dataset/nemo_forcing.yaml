name: nemo_forcing

folder: "H:/NordicSeas/ECMWF"
variable_names: [msl, u10, v10]

# Optional new names/attrs:
variable_attrs: 
  msl:
    units: Pa
    long_name: "mean sea level pressure"
  u10:
    units: "m s**-1"
    long_name: "10 metre U wind component"
  v10:
    units: "m s**-1"
    long_name: "10 metre V wind component"

# interpolation/extrapolation method(s): a single string or a list of strings with one entry per variable
interp_method: bilinear
extrap_method: nearest_s2d

use_mask: false  # ERA5 is a complete global field; NaN (if any) is coverage, not land

# Optional: ERA5 is 3-hourly; interpolate onto domain.ts's hourly grid.
time_interp_method: [linear, 3]  # // # [method, max_gap (hours)]

# paired vector variables for rotation-aware regridding (from true north/east into the target grid's local basis):
pair_vars_list:
  - [u10, v10]

reader_fn:
  _target_: readers.read_nc
  _partial_: true
