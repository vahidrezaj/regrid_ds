name: hbm_bathymetry
source: hbm

folder: "${hbm_root}/bathymetry"
variable_names: [level]

# Optional new names/attrs:
variable_attrs: null

# no time axis: one-shot regrid, saved to a .npz file instead of the Zarr time series
static: true
file_ext: .tif

# interpolation method(s): a single string or a list of strings with one entry per variable
interp_method: bilinear

# hbm_ocean's land mask (the .tif's own NaN is both land and no coverage) + fill non-land gaps
land_mask: true
fill_method: laplace  # // nearest, laplace or null

reader_fn:
  _target_: readers.read_tif
  _partial_: true
  variable_names: ${dataset.variable_names}
  # bsns_005.tif has no CRS embedded, but its pixel coordinates are already plain WGS84 lon/lat
  crs: EPSG:4326
  # coarsen the native raster down to ~this resolution before regridding;
  resolution_km: 2
