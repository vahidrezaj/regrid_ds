name: nemo_bathymetry
source: nemo

folder: "${nemo_root}/ocean"
variable_names: [bathy_metry]

# Optional new names/attrs:
variable_attrs: null

# no time axis: one-shot regrid, saved to a .npz file instead of the Zarr time series
static: true
file_ext: .nc

# interpolation method(s): a single string or a list of strings with one entry per variable
interp_method: bilinear

# nemo_ocean's land mask + fill non-land gaps
land_mask: true
fill_method: laplace  # // nearest, laplace or null

reader_fn:
  _target_: nemo_reader.read_nemo_bathymetry
  _partial_: true
  variable_name: bathy_metry
