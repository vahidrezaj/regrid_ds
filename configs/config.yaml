defaults:
  - dataset: hbm_ocean
  - preprocessing: baltic_sea
  - _self_

output_path: data/${preprocessing.name}
verbose: false
mode: run  # // one of: run, dry_run, check


# //log format//
hydra:
  job_logging:
    formatters:
      simple:
        format: '%(asctime)s %(levelname)-7s %(message)s'
        datefmt: '%H:%M:%S'