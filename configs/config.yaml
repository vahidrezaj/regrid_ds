defaults:
  - dataset: hbm_ocean
  - domain: baltic_sea
  - _self_

save_to: data
output_path: ${save_to}/${domain.name}
verbose: false
mode: run  # // one of: run, dry_run, check


# //log format//
hydra:
  job_logging:
    formatters:
      simple:
        format: '%(asctime)s %(levelname)-7s %(message)s'
        datefmt: '%H:%M:%S'