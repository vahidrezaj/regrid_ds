defaults:
  - dataset: hbm_ocean
  - domain: baltic_sea
  - _self_

# source data roots, per machine: set HBM_ROOT/NEMO_ROOT env vars, else fall back to the local paths
hbm_root: ${oc.env:HBM_ROOT,H:/dmi}
nemo_root: ${oc.env:NEMO_ROOT,H:/NordicSeas}

save_to: data
output_suffix: ""  # // e.g. "_test2" via CLI override
output_path: ${save_to}/${dataset.source}_${domain.name}${output_suffix}
verbose: false
mode: run  # // one of: run, land_mask, dry_run, check, rechunk, fill_gaps
gap_len: null  # // mode=fill_gaps: longest run of missing timesteps to interpolate over


# //log format//
hydra:
  job_logging:
    formatters:
      simple:
        format: '%(asctime)s %(levelname)-7s %(message)s'
        datefmt: '%H:%M:%S'